version: 2

updates:

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:

      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:

      - dependency-name: "com.graphhopper:graphhopper-core"
      - dependency-name: "com.github.luben:zstd-jni"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
